<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập Lịch sử Đảng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
/* Layout: một cột 720px; thẻ câu hỏi ở giữa, thanh tiến độ dính phía trên */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --fg:#161a2b; --muted:#5d6479; --line:#dcdfe8;
  --accent:#2a3f8f; --accent-fg:#ffffff; --accent-soft:#e6eaf8;
  --ok:#17794a; --ok-soft:#e1f4ea; --bad:#b3261e; --bad-soft:#fbe7e5;
  --ck:#a5470f; --ck-soft:#fde9d9;
  --font-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10131f; --surface:#181c2c; --fg:#e9ebf4; --muted:#9aa2ba; --line:#2b3150;
  --accent:#8fa4f5; --accent-fg:#10131f; --accent-soft:#222a4d;
  --ok:#5fd39b; --ok-soft:#14352a; --bad:#ff8e86; --bad-soft:#3b1e1d;
  --ck:#ffab7a; --ck-soft:#4a2a16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131f; --surface:#181c2c; --fg:#e9ebf4; --muted:#9aa2ba; --line:#2b3150;
  --accent:#8fa4f5; --accent-fg:#10131f; --accent-soft:#222a4d;
  --ok:#5fd39b; --ok-soft:#14352a; --bad:#ff8e86; --bad-soft:#3b1e1d;
  --ck:#ffab7a; --ck-soft:#4a2a16; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:24px 56px}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:clamp(1.7rem,5vw,2.2rem)} h2{font-size:1.3rem}
p{margin:0}
.muted{color:var(--muted)}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:12px 20px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.theme{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:.85rem;flex:none}
.head{display:flex;gap:12px;align-items:flex-start}
/* home */
.presets{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:12px}
.preset{text-align:left;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.preset b{display:block;font-weight:600}
.preset span{font-size:.85rem;color:var(--muted)}
.preset[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chapters{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:10px}
.chk{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-width:0}
.chk input{width:18px;height:18px;accent-color:var(--accent);flex:none;margin-top:3px}
.chk b{display:block;font-weight:600;font-size:.95rem}
.chk div>span{font-size:.82rem;color:var(--muted)}
.chk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt-line{display:flex;gap:10px;align-items:center;cursor:pointer}
.opt-line input{width:18px;height:18px;accent-color:var(--accent)}
select{font:inherit;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.badge{font-size:.72rem;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--accent-soft);color:var(--accent)}
.badge.ck{background:var(--ck-soft);color:var(--ck)}
/* quiz */
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:2;display:flex;flex-direction:column;gap:8px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.q{font-family:var(--font-display);font-size:clamp(1.12rem,3.6vw,1.35rem);line-height:1.5;font-weight:500;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.opt:not(:disabled):hover{border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt .t{min-width:0;overflow-wrap:anywhere;padding-top:3px}
.opt:disabled{cursor:default;color:var(--fg)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.verdict{margin-top:16px;font-weight:600}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;align-items:center}
.tag{font-size:.78rem;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:8px}
/* result */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-family:var(--font-display);font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:12px}
.rv{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.rv p{margin-bottom:8px;overflow-wrap:anywhere}
.rv .you{color:var(--bad)} .rv .right{color:var(--ok)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DATA = [{"ch":0,"n":1,"q":"Một trong những nhiệm vụ hàng đầu khi nghiên cứu khoa học Lịch sử Đảng Cộng sản Việt Nam là:","o":["Tìm hiểu về lịch sử ra đời của đảng cộng sản trên thế giới.","Khẳng định, chứng minh giá trị khoa học của những mục tiêu chiến lược và sách lược cách mạng mà Đảng đề ra trong cương lĩnh.","Chọn lọc ra những sự kiện lịch sử nổi bật để tái hiện lại sự thành công trong quá trình lãnh đạo của Đảng.","Làm cho người học hiểu được quyền lực của Đảng, từ đó thêm trung thành với đường lối lãnh đạo của Đảng."],"a":1},{"ch":0,"n":2,"q":"Là một ngành của khoa học lịch sử, lịch sử Đảng có các chức năng của khoa học lịch sử đồng thời có chức năng nổi bật là:","o":["Chức năng nhận thức, điều tiết, chọn lọc, tìm kiếm.","Chức năng nhận thức, giáo dục, dự báo và phê phán.","Chức năng giáo dục, sàng lọc, tuyên truyền và tìm kiếm.","Chức năng tuyên truyền, phổ cập, giáo huấn và phổ quát."],"a":1},{"ch":0,"n":3,"q":"Đối tượng nghiên cứu của Khoa học Lịch sử Đảng Cộng sản Việt Nam là:","o":["Sự ra đời, phát triển, hoạt động lãnh đạo của Đảng qua các thời kỳ.","Các đảng viên Đảng cộng sản Việt Nam.","Các văn kiện Đảng chuẩn bị lưu hành.","Những hạn chế của Đảng Cộng sản."],"a":0},{"ch":0,"n":4,"q":"Nghiên cứu, học tập lịch sử Đảng cần quán triệt tính đảng và tính khoa học. Vậy “tính khoa học” trong nghiên cứu lịch sử Đảng là gì?","o":["Là sự phản ánh kết quả nghiên cứu sự vật, hiện tượng, sự kiện lịch sử phải đạt đến chân lý khách quan dựa trên luận cứ khoa học, tôn trọng hiện thực lịch sử.","Là đứng trên lập trường chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh để nhận thức lịch sử một cách khoa học, đúng đắn, luôn luôn kế thừa và phát triển sáng tạo.","Là kết quả nghiên cứu các sự vật, hiện tượng dựa trên kinh nghiệm của nhân dân.","Là phát hiện ra giai cấp công nhân là lực lượng xã hội có thể thủ tiêu chủ nghĩa tư bản, xây dựng chủ nghĩa xã hội."],"a":0},{"ch":0,"n":5,"q":"Việc tiến hành thảo luận, trao đổi các vấn đề do giảng viên đưa ra để có thể hiểu rõ hơn nội dung của môn học lịch sử Đảng Cộng sản Việt Nam thì được gọi là:","o":["phương pháp làm việc biện chứng.","phương pháp làm việc khách quan.","phương pháp làm việc chủ quan.","phương pháp làm việc nhóm."],"a":3},{"ch":0,"n":6,"q":"Nghiên cứu, học tập lịch sử Đảng cần quán triệt tính đảng và tính khoa học. Vậy “tính đảng” là gì?","o":["Là chỉ ra sự cần thiết phải thay thế chủ nghĩa tư bản bằng chủ nghĩa xã hội. Đứng trên lập trường của giai cấp tư.","Là phát hiện ra giai cấp công nhân là lực lượng xã hội có thể thủ tiêu chủ nghĩa tư bản, xây dựng chủ nghĩa xã hội.","Là phản ánh đúng khát vọng của nhân dân lao động bị áp bức, khẳng định sứ mệnh lịch sử của giai cấp nông dân.","Là đứng trên lập trường chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh để nhận thức lịch sử một cách khoa học, đúng đắn, luôn luôn kế thừa và phát triển sáng tạo."],"a":3},{"ch":0,"n":7,"q":"Trong phương pháp nghiên cứu, học tập môn học Lịch sử Đảng Cộng sản Việt Nam cần phải dựa trên phương pháp luận khoa học Mácxít, đồng thời phải nắm vững chủ nghĩa nào dưới đây để xem xét và nhận thức lịch sử một cách khách quan, trung thực và đúng quy luật?","o":["Chủ nghĩa duy vật biện chứng và chủ nghĩa duy vật lịch sử.","Chủ nghĩa duy lý và chủ nghĩa duy vật lịch sử.","Chủ nghĩa duy tâm và chủ nghĩa duy vật.","Chủ nghĩa duy lý và chủ nghĩa duy vật biện chứng."],"a":0},{"ch":0,"n":8,"q":"Bản cương lĩnh đầu tiên của Đảng Cộng sản Việt Nam ra đời năm bao nhiêu?","o":["1932.","1930.","1933.","1931."],"a":1},{"ch":0,"n":9,"q":"“Đảng lấy chủ nghĩa Mác - Lênin, … làm nền tảng tư tưởng, kim chỉ nam cho hành động”","o":["truyền thống đoàn kết.","truyền thống yêu nước.","tư tưởng Ăngghen.","tư tưởng Hồ Chí Minh."],"a":3},{"ch":0,"n":10,"q":"Đảng lãnh đạo cách mạng giải phóng dân tộc, xây dựng đất nước bằng…","o":["lý luận của chủ nghĩa Mác - Lênin.","thông báo, giấy tờ tuyên truyền được in bởi các Nhà xuất bản của Việt Nam.","cương lĩnh, đường lối, chủ trương, chính sách lớn.","tư tưởng của các nhà triết học nổi tiếng."],"a":2},{"ch":0,"n":11,"q":"Năm 1933, tác phẩm “Sơ thảo lịch sử phong trào Đông Dương” là bản nghiên cứu tổng hợp đầu tiên về lịch sử Đảng. Tác phẩm này của ai?","o":["Trường Chinh.","Võ Nguyên Giáp.","Lê Duẩn.","Hà Huy Tập."],"a":3},{"ch":0,"n":12,"q":"Cần phải coi trọng phương pháp tổng kết thực tiễn lịch sử gắn với nghiên cứu lý luận trong nghiên cứu lịch sử Đảng để:","o":["làm hài lòng người dân trong quá trình lãnh đạo của Đảng.","dễ dàng thống kê những thành tựu mà Đảng đạt được trong lãnh đạo cách mạng.","làm rõ kinh nghiệm, bài học, quy luật phát triển của cách mạng Việt Nam.","chứng tỏ sự linh hoạt trong các bước để đề ra đường lối, chủ trương của Đảng."],"a":2},{"ch":0,"n":13,"q":"Khoa học lịch sử Đảng có mấy nhiệm vụ trọng tâm:","o":["2.","1.","3.","4"],"a":3},{"ch":0,"n":14,"q":"Trong nghiên cứu lịch sử Đảng, khi xem xét, đối chiếu các hiện tượng lịch sử trong hình thức tổng quát nhằm vạch ra bản chất, quy luật trong sự vận động của sự vật thì đó là phương pháp nghiên cứu nào?","o":["Phương pháp làm việc nhóm.","Phương pháp logic.","Phương pháp tổng hợp.","Phương pháp lịch sử."],"a":1},{"ch":0,"n":15,"q":"Môn học Lịch sử Đảng Cộng sản Việt Nam nghiên cứu nội dung gì?","o":["Các sự kiện lịch sử Đảng, hệ thống tổ chức Đảng","Thắng lợi, thành tựu, kinh nghiệm, bài học của cách mạng Việt Nam","Cương lĩnh, đường lối, chủ trương, chính sách","Tất cả các đáp án trên"],"a":3},{"ch":0,"n":16,"q":"Là một ngành của khoa học lịch sử, Lịch sử Đảng Cộng sản Việt Nam có các chức năng, nhiệm vụ của khoa học lịch sử, đồng thời còn có thêm các chức năng nổi bật khác là:","o":["Chức năng nhận thức, chọn lọc, điều tiết, tìm kiếm","Chức năng nhận thức, giáo dục, dự báo, phê phán","Chức năng tuyên truyền, giáo huấn, phổ cập","Chức năng giáo dục, sàng lọc, tuyên truyền và tìm kiếm"],"a":1},{"ch":0,"n":17,"q":"Tại sao khi nghiên cứu, học tập Lịch sử Đảng Cộng sản Việt Nam lại cần phải nhận thức và vận dụng chủ nghĩa duy vật lịch sử","o":["Để thấy được sự ưu việt của Đảng Cộng sản Việt Nam với các đảng phái ở Phương Tây","Để nhận thức tiến trình cách mạng do Đảng Cộng sản Việt Nam lãnh đạo","Để hiểu được sứ mệnh lịch sử của giai cấp nông dân trong lãnh đạo cách mạng","Để hiểu vì sao cách mạng giải phóng dân tộc ở Việt Nam đi theo con đường cách mạng tư sản"],"a":1},{"ch":0,"n":18,"q":"Bộ môn Lịch sử Đảng Cộng sản Việt Nam chính thức được đưa vào giảng dạy, học tập chính thức trong các trường đại học, cao đẳng, trung cấp chuyên nghiệp khi nào?","o":["Từ những năm 60 của TK XX","Năm 2009","Từ những năm 60 của TK XIX","Năm 1986"],"a":0},{"ch":1,"n":1,"q":"Thời gian diễn ra cuộc khai thác thuộc địa lần thứ nhất của thực dân Pháp ở Việt Nam?","o":["1897 - 1914.","1884 - 1914.","1858 - 1914.","1873 - 1914."],"a":0},{"ch":1,"n":2,"q":"Trong những điểm sau đây nói về chính sách thống trị của thực dân Pháp đã tác động mạnh mẽ tới xã hội Việt Nam điểm nào SAI?","o":["Cho ra đời hai giai cấp mới là công nhân và tư sản Việt Nam.","Làm cho xã hội Việt Nam phong kiến trở thành xã hội thuộc địa nửa phong kiến.","Nảy sinh mâu thuẫn cơ bản trong đời sống xã hội Việt Nam là mâu thuẫn giữa toàn thể dân tộc Việt Nam với thực dân Pháp xâm lược.","Chống đế quốc, giải phóng dân tộc là nhiệm vụ hàng đầu."],"a":3},{"ch":1,"n":3,"q":"Dưới chế độ thực dân phong kiến, giai cấp nông dân có yêu cầu bức thiết nhất là gì?","o":["Độc lập dân tộc.","Ruộng đất.","Quyền bình đẳng nam nữ.","Được giảm tô, giảm tức."],"a":0},{"ch":1,"n":4,"q":"Phong trào do Phan Bội Châu khởi xướng thuộc khuynh hướng nào trong các khuynh hướng sau?","o":["Phong trào yêu nước theo khuynh hướng Cần Vương.","Phong trào yêu nước theo khuynh hướng phong kiến.","Phong trào yêu nước theo khuynh hướng dân chủ tư sản.","Phong trào yêu nước theo khuynh hướng vô sản."],"a":2},{"ch":1,"n":5,"q":"Trong cuộc khai thác thuộc địa lần thứ nhất của thực dân Pháp, giai cấp nào mới được hình thành?","o":["Giai cấp nông dân.","Giai cấp đia chủ.","Giai cấp nông dân và địa chủ.","Giai cấp công nhân."],"a":3} ","“Tất cả cho chiến dịch được toàn thắng”."],"a":0},{"ch":2,"n":16,"q":"Văn kiện nào sau đây có ý nghĩa to lớn như lời hịch cứu quốc, như mệnh lệnh chiến đấu của nhân dân ta trong cuộc kháng chiến chống thực dân Pháp?","o":["“Luận cương chính trị” của Đảng Cộng sản Việt Nam.","“Cương lĩnh chính trị” đầu tiên của Đảng Cộng sản Việt Nam.","“Lời kêu gọi toàn quốc kháng chiến” của Chủ tịch Hồ Chí Minh.","“Tuyên ngôn độc lập” của Chủ tịch Hồ Chí Minh."],"a":2},{"ch":2,"n":17,"q":"Đảng chủ trương trường kì kháng chiến vì:","o":["Muốn thực dân Pháp từ bỏ mộng xâm lược nước ta.","Muốn các nước tư bản đồng minh giúp đỡ ta.","Thực dân Pháp lựa chọn cách đánh lâu dài với ta.","Tương quan lực lượng ban đầu không có lợi cho ta."],"a":3},{"ch":2,"n":18,"q":"Để bồi dưỡng sức dân, đặc biệt là nông dân, năm 1953, Đảng và Chính phủ đã:","o":["Phát động phong trào «kháng chiến hóa văn hóa».","Tiếp tục tiến hành cải cách giáo dục trên quy mô cả nước.","Phát động triệt để giảm tô và cải cách ruộng đất.","Mở cuộc vận động lao động sản xuất và thực hành tiết kiệm."],"a":2},{"ch":2,"n":19,"q":"Tác dụng của việc nhân nhượng với Trung Hoa Dân quốc ở miền Bắc nước ta?","o":["Hạn chế đến mức thấp nhất những hoạt động chống phá của Trung Hoa Dân quốc.","Từng bước loại dần từng kẻ thù trên đất nước Việt Nam.","Làm thất bại âm mưu tiêu diệt chính quyền cách mạng Việt Nam của chúng.","Tạo điều kiện cho ta tập trung đối phó với cuộc xâm lược của Pháp ở Nam Bộ."],"a":0},{"ch":2,"n":20,"q":"Nguyên nhân quan trọng nhất khiến Đảng ta chủ trương khi tạm thời hòa hoãn với Tưởng để chống Pháp, khi hoà hoãn với Pháp để đuổi Tưởng là:","o":["Quân Trung Hoa Dân quốc dùng bọn tay sai phá ta từ bên trong.","Quân Trung Hoa Dân quốc có nhiều âm mưu chống phá cách mạng.","Thực dân Pháp được sự giúp đỡ, hậu thuẫn của thực dân Anh.","Chính quyền của ta còn non trẻ, không thể cùng một lúc chống hai kẻ thù."],"a":3},{"ch":2,"n":21,"q":"Sách lược đối ngoại của Đảng ta từ tháng 9/1945 đến tháng 2/1946 là:","o":["Hòa Trung Hoa Dân quốc, đuổi Pháp.","Hòa hoãn với Pháp và Trung Hoa Dân quốc.","Hòa Trung Hoa Dân quốc, đánh Pháp.","Hòa Pháp, đuổi Trung Hoa Dân quốc."],"a":2},{"ch":2,"n":22,"q":"Năm 1951, Đảng ta chủ trương thành lập Liên minh nhân dân Việt - Miên - Lào nhằm:","o":["Tăng cường tình đoàn kết nhân dân ba nước Đông Dương.","Kêu gọi nhân dân ba nước liên minh chống Pháp.","Tạo sức mạnh tổng hợp đấu tranh chống Pháp.","Tạo sức mạnh của nhân dân ba nước Đông Dương."],"a":0},{"ch":2,"n":23,"q":"Đặc điểm lớn nhất, độc đáo nhất của cách mạng Việt Nam thời kì 1954-1975 là:","o":["Đảng lãnh đạo nhân dân hoàn thành cách mạng dân chủ và xã hội chủ nghĩa trong cả nước.","Đảng lãnh đạo nhân dân hoàn thành cuộc cách mạng dân chủ nhân dân trong cả nước.","Một Đảng lãnh đạo nhân dân tiến hành đồng thời hai chiến lược cách mạng ở hai miền Nam- Bắc.","Đảng lãnh đạo cả nước đi lên xây dựng chủ nghĩa xã hội, tiến hành công nghiệp hóa đất nước."],"a":2},{"ch":2,"n":24,"q":"Bộ Chính trị Trung ương Đảng đề ra kế hoạch giải phóng hoàn toàn miền Nam trong điều kiện lịch sử:","o":["Quân Mỹ và quân đội Sài Gòn bắt đầu suy yếu.","Chính quyền và quân đội Sài Gòn bắt đầu khủng hoảng và suy yếu.","Tình hình so sánh lực lượng ở miền Nam phần nào có lợi cho cách mạng nước ta.","Tình hình so sánh lực lượng ở miền Nam thay đổi mau lẹ có lợi cho cách mạng."],"a":3},{"ch":2,"n":25,"q":"Thành công của cuộc Tổng tuyển cử bầu Quốc hội (1946) ở Việt Nam chứng tỏ:","o":["Quyền lực nhà nước chính thức thuộc về cơ quan hành pháp.","Nhân dân bước đầu giành chính quyền, làm chủ đất nước.","Nhân dân có tinh thần đoàn kết và ý thức làm chủ đất nước.","Sự ủng hộ to lớn của cộng đồng quốc tế đối với Việt Nam."],"a":2},{"ch":2,"n":26,"q":"Đọc đoạn trích và trả lời câu hỏi: Ngày 01/4/1975, Bộ Chính trị nhận định: Cách mạng nước ta đang phát triển với nhịp độ “một ngày bằng hai mươi năm”.Do vậy, Bộ Chính trị quyết định: \"chúng ta phải nắm vững thời cơ chiến lược, quyết tâm thực hiện tổng tiến công và nổi dậy, kết thúc thắng lợi chiến tranh giải phóng trong thời gian ngắn nhất. Tốt hơn cả là bắt đầu và kết thúc trong tháng 4 năm nay, không để chậm” (Đảng Cộng sản Việt Nam, Văn kiện Đảng Toàn tập, Tập 36, Nxb Chính trị Quốc gia, Hà Nội, 2004, tr.95).Nội dung đoạn trích trên phản ánh chủ trương nào của Bộ Chính trị Trung ương Đảng Cộng sản Việt Nam?","o":["Sự nắm bắt thời cơ khách quan thuận lợi cho tiến công.","Sự thay đổi phương châm tác chiến trên chiến trường.","Sự điều chỉnh thời gian giải phóng hoàn toàn miền Nam.","Quyết định chuyển hướng chỉ đạo chiến lược của Đảng."],"a":2},{"ch":2,"n":27,"q":"Trong cuộc kháng chiến chống Pháp (1945-1954), Đảng Cộng sản Đông Dương đề ra đường lối kháng chiến tự lực cánh sinh đã chứng tỏ điều gì?","o":["Việt Nam không cần dựa vào sự giúp đỡ của quốc tế.","Yếu tố khách quan không có vai trò trong cách mạng.","Độc lập dân tộc phải do chính mình giành và giữ lấy.","Sự giúp đỡ của các nước không phù hợp với Việt Nam."],"a":2},{"ch":2,"n":28,"q":"Trong những năm 1945 -1946, chính phủ Việt Nam dân chủ Cộng hòa chủ trương hòa hoãn với quân Trung Hoa Dân quốc và thực dân Pháp dựa trên nguyên tắc nào?","o":["Duy trì sự lãnh đạo của Đảng.","Tuân thủ luật pháp quốc tế.","Giữ vững độc lập dân tộc.","Giải quyết tranh chấp bằng hòa bình."],"a":2},{"ch":2,"n":29,"q":"Công cụ xây dựng và bảo vệ đất nước Việt Nam Dân chủ Cộng hòa sau năm 1945 là:","o":["Một mặt trận dân tộc thông nhất phát triển rộng khắp.","Một chính sách ngoại giao mềm dẻo, khôn khéo.","Một nền kinh tế- tài chính từng bước vững mạnh.","Một bộ máy chính quyền nhà nước dần được hoàn thiện."],"a":3},{"ch":2,"n":30,"q":"Phương châm chiến lược trong hai cuộc kháng chiến chống Pháp và chống Mĩ xâm lược (1945-1975) của nhân dân Việt Nam có điểm chung nào?","o":["Dựa vào chiến tranh du kích là chính.","Dùng lực lượng mạnh áp đảo kẻ thù.","Hiệp đồng binh chủng trong mỗi trận đánh.","Giữ vững tư tưởng tích cực tiến công."],"a":3},{"ch":2,"n":31,"q":"Bài học cơ bản cho cách mạng Việt Nam được rút ra từ việc tổ chức thành công Đại hội đại biểu toàn quốc lần thứ III của Đảng Lao động Việt Nam (9/1960) là gì?","o":["Tập trung xây dựng chủ nghĩa xã hội ở miền Bắc.","Mềm dẻo linh hoạt trong thực hiện lãnh đạo, chỉ đạo cách mạng.","Chỉ đạo sâu sát, quyết liệt cho cách mạng miền Nam.","Chỉ đạo đạo cách mạng cho cả hai miền Bắc - Nam."],"a":1},{"ch":2,"n":32,"q":"Phương châm tác chiến của quân dân ta trong chiến dịch Hồ Chí Minh (4/1975) là:","o":["“Cơ động, linh hoạt, chắc thắng”.","“Đánh nhanh, thắng nhanh”.","“Tiến ăn chắc, đánh ăn chắc”.","“Thần tốc, táo bạo, bất ngờ, chắc thắng”."],"a":3},{"ch":2,"n":33,"q":"Tháng 02-1951, tại Vinh Quang (Chiêm Hóa- Tuyên Quang) đã diễn ra sự kiện nào sau đây?","o":["Đại hội thống nhất Mặt trận Việt Minh và Hội Liên Việt.","Đại hội đại biểu toàn quốc lần thứ II của Đảng cộng sản Đông Dương.","Đại hội chiến sĩ thi đua và cán bộ gương mẫu toàn quốc lần thứ I.","Hội nghị đại biểu để thành lập Liên minh nhân dân Việt - Miên - Lào."],"a":1},{"ch":2,"n":34,"q":"Trong cuộc kháng chiến chống Mĩ, cứu nước (1954-1975) địa bàn Tây Nguyên là nơi được Đảng Lao động Việt Nam chọn để mở đầu cho sự kiện trọng đại nào?","o":["Cuộc tiến công chiến lược năm 1972.","Tổng tiến công và nổi dậy Xuân 1975.","Tổng tiến công và nổi dậy Xuân Mậu Thân 1968.","Trận “Điện Biên Phủ trên không” năm 1972."],"a":1},{"ch":2,"n":35,"q":"Sự kiện trực tiếp nào đưa đến quyết định toàn quốc kháng chiến của Đảng và Chính phủ?","o":["Ngày 18/12 thực dân Pháp đưa liên tiếp ba tối hậu thư cho chính phủ ta.","Thực dân Pháp liên tiếp tấn công ta ở Nam Bộ và Nam Trung Bộ.","Hội nghị Phôngtennơblô giữa chính phủ ta và chính phủ Pháp đã thất bại.","Thực dân Pháp đã chiếm đóng được nhiều nơi ở Hải Phòng và Lạng Sơn."],"a":0},{"ch":2,"n":36,"q":"Đại hội đại biểu toàn quốc lần thứ III (9/1960) xác định “tiền tuyến lớn” trong cuộc kháng chiến chống Mĩ xâm lược là:","o":["Miền Bắc.","Miền Nam.","Miền Tây.","Miền Trung."],"a":1},{"ch":2,"n":37,"q":"Trước cuộc tấn công mùa đông của giặc Pháp 1947, Đảng ta quyết tâm bảo vệ căn cứ địa Việt Bắc vì:","o":["Việt Bắc là căn cứ địa của ba nước Đông Dương.","Việt Bắc tập trung các cơ quan đầu não của ta.","Việt Bắc là chiến trường chính giữa ta và Pháp.","Việt Bắc là trung tâm của thủ đô Hà Nội."],"a":1},{"ch":2,"n":38,"q":"Sự kiện nào dưới đây chứng tỏ nhân dân Việt Nam đã được thực hiện quyền công dân sau Cách mạng tháng Tám?","o":["Tổng tuyển cử bầu Quốc hội trong cả nước (1/1946).","Kì họp đầu tiên Quốc hội khóa I (3/1946).","Phát hành tiền Việt Nam (11/1946).","Nha Bình dân học vụ được thành lập (8/9/1945)."],"a":0},{"ch":2,"n":39,"q":"Quyền dân tộc cơ bản mà nhân dân Việt Nam được ghi nhận trong nội dung Hiệp định Giơ-ne-vơ năm 1954 về Đông Dương là:","o":["Quyền tự chủ, dân tộc tự quyết, toàn vẹn lãnh thổ.","Độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ.","Độc lập, chủ quyền, không can thiệp vào công việc nội bộ.","Độc lập, thống nhất, quyền tự quyết và quyền bình đẳng."],"a":1},{"ch":2,"n":40,"q":"Tháng 9/1953, Bộ Chính trị Trung ương Đảng đề ra chủ trương tập trung lực lượng mở những cuộc tiến công vào những hướng quan trọng về chiến lược mà địch tương đối yếu nhằm:","o":["Buộc thực dân Pháp phải đàm phán để kết thúc chiến tranh.","Giải phóng vùng Tây Bắc, tạo điều kiện giải phóng Bắc Lào.","Làm thất bại kế hoạch tập trung binh lực của thực dân Pháp.","Tiêu diệt toàn bộ quân sự của thực dân Pháp ở Tây Bắc."],"a":2},{"ch":2,"n":41,"q":"Đại hội nào dưới đây của Đảng được xem là “Đại hội kháng chiến thắng lợi”?","o":["Đại hội đại biểu toàn quốc lần thứ II (02-1951).","Đại hội đại biểu toàn quốc lần thứ I (3-1935).","Đại hội đại biểu toàn quốc lần thứ III (9-1960).","Đại hội đại biểu toàn quốc lần thứ IV (12-1976)."],"a":0},{"ch":2,"n":42,"q":"Nội dung nào KHÔNG phản ánh rõ đường lối chiến tranh nhân dân của Đảng Lao động Việt Nam được triển khai ở miền Nam Việt Nam trong kháng chiến chống Mĩ?","o":["Đánh địch trên cả ba vùng chiến lược, tiến công địch bằng ba mũi giáp công.","Hoàn thành khởi nghĩa từng phần rồi tiến lên chiến tranh cách mạng.","Kết hợp đấu tranh quân sự với đấu tranh chính trị và đấu tranh ngoại giao.","Kết hợp lực lượng chính trị quần chúng và lực lượng vũ trang nhân dân."],"a":1},{"ch":2,"n":43,"q":"Chiến dịch nào dưới đây thể hiện cách đánh diệt viện của ta?","o":["Chiến dịch Tây Bắc.","Chiến dịch Biên giới thu - đông 1950.","Chiến dịch hòa bình.","Chiến dịch Việt Bắc thu đông 1947."],"a":1},{"ch":2,"n":44,"q":"Cuối năm 1974 đầu năm 1975, Bộ Chính trị Trung ương Đảng đề ra chủ trương, kế hoạch giải phóng miền Nam Việt Nam dựa trên cơ sở quan trọng nào?","o":["Quân đội Sài Gòn không đề ra các biện pháp kháng cự.","Ý chí quyết tâm thống nhất đất nước của nhân dân hai miền.","Mĩ đã ngừng viện trợ cho chính quyền và quân đội Sài Gòn.","Mĩ đã rút toàn bộ lực lượng quân sự ra khỏi miền Nam."],"a":1},{"ch":2,"n":45,"q":"Đọc đoạn tư liệu và trả lời câu hỏi: “Muốn củng cố nền tự do, độc lập, chúng ta cần sức hy sinh phấn đấu của toàn quốc đồng bào; nhưng chúng ta cũng rất cần sự quyên giúp của nhân dân, nhất là những nhà giầu có. Ý nghĩa của Tuần lễ vàng là ở đó” (Hồ Chí Minh toàn tập, tập 4, trang 16).Việc tổ chức thành công Tuần lễ vàng năm 1945 ở Việt Nam đã chứng tỏ điều gì?","o":["Xây dụng nền tài chính độc lập là nhiệm vụ đầu tiên và quan trọng nhất của cách mạng.","Việt Nam đã có đủ tiềm lực để tiến hành kháng chiến chống thực dân Pháp ở miền Nam.","Chính quyền cách mạng đã hoàn thành cải tạo xã hội chủ nghĩa đối với giai cấp địa chủ.","Sự sáng tạo của Đảng và Chính phủ trong việc huy động quần chung tham gia việc nước."],"a":3},{"ch":2,"n":46,"q":"Văn kiện nào dưới đây được thông qua tại Đại hội đại biểu toàn quốc lần II (2/1951)?","o":["Cương lĩnh chính trị đầu tiên của Đảng.","Sách lược vắn tắt, điều lệ vắn tắt của Đảng.","Luận cương chính trị của Trần Phú.","Báo cáo chính trị của Chủ tịch Hồ Chí Minh."],"a":3},{"ch":2,"n":47,"q":"Ngày 8/9/1945, Chủ tịch Hồ Chí Minh kí sắc lệnh gì dưới đây?","o":["Thành lập Nha An ninh - quân đội.","Thành lập Nha Bình dân học vụ.","Thành lập quân đội quốc gia Việt Nam.","Thành lập Nha Cảnh sát quốc gia."],"a":1},{"ch":2,"n":48,"q":"“…Chúng ta muốn hòa bình, chúng ta phải nhân nhượng. Nhưng chúng ta càng nhân nhượng, thực dân Pháp càng lấn tới, vì chúng quyết tâm cướp nước ta lần nữa…”. Đoạn trích trong “Lời kêu gọi toàn quốc kháng chiến” của Chủ tịch Hồ Chí Minh đã phản ánh:","o":["Thiện chí hòa bình của Đảng, Chính phủ, nhân dân Việt Nam.","Quyết tâm chống Pháp của dân tộc Việt Nam.","Tội ác của thực dân Pháp.","Quyết tâm xâm lược của thực dân Pháp."],"a":3},{"ch":2,"n":49,"q":"Nguyên nhân chủ quan cơ bản nhất dẫn đến thắng lợi của cuộc kháng chiến chống Mĩ cứu nước là:","o":["Sự lãnh đạo sáng suốt của Đảng đứng đầu là chủ tịch Hồ Chí Minh.","Truyền thống yêu nước, đoàn kết của nhân dân ta.","Hậu phương miền Bắc không ngừng lớn mạnh.","Tinh thần chiến đấu dũng cảm của quân dân cả nước."],"a":0},{"ch":2,"n":50,"q":"Đảng và Chính phủ quyết định kêu gọi toàn dân kháng chiến chống thực dân Pháp vào 12/1946 vì:","o":["không thể tiếp tục nhân nhượng trước những hành động xâm lược của Pháp.","tiềm lực cho cuộc kháng chiến lâu dài của ta đã chuẩn bị đầy đủ.","nhờ có sự ủng hộ to lớn của Liên Xô và Trung Quốc giúp ta đánh Pháp.","lợi dụng thời điểm Pháp đang trên đà thất bại, ta đánh đuổi Pháp về nước."],"a":0},{"ch":2,"n":51,"q":"Đảng ta đã phát động cuộc kháng chiến toàn quốc chống thực dân Pháp xuất phát từ lí do chủ yếu nào?","o":["Thực dân Pháp khiêu khích tấn công ta ở Hà Nội.","Chúng ta muốn hòa bình xây dựng đất nước.","Nền độc lập chủ quyền nước ta bị đe dọa nghiêm trọng.","Pháp không thực hiện Hiệp định sơ bộ 06-3-1946 và Tạm ước 14-9-1946."],"a":2},{"ch":2,"n":52,"q":"Sách lược đấu tranh chống ngoại xâm của ta trong năm đầu sau Cách mạng tháng Tám chứng tỏ:","o":["Đập tan âm mưu xâm lược nước ta lần thứ hai của thực dân Pháp.","Đường lối sáng suốt, cứng rắn về nguyên tắc, mềm dẻo về sách lược của Đảng.","Phát huy thuận lợi, khắc phục khó khăn, xây dựng bảo vệ chính quyền cách mạng.","Truyền thống yêu nước, tinh thần đấu tranh bảo vệ tổ quốc của nhân dân ta."],"a":1},{"ch":2,"n":53,"q":"Phương hướng cách mạng miền Nam trong chiến đấu trong chiến lược “chiến tranh đặc biệt” được Đảng xác định như thế nào?","o":["Kết hợp chặt chẽ lực lượng chính trị và lực lượng vũ trang.","Tổng tiến công quân sự kết hợp với đấu tranh ngoại giao.","Sử dụng bạo lực cách mạng, tổng khởi nghĩa giành chính quyền.","Tiến hành chiến tranh bằng hình thức tiến công và nổi dậy."],"a":0},{"ch":2,"n":54,"q":"Một trong những nhiệm vụ xuyên suốt của cách mạng miền Bắc từ năm 1960 đến năm 1975 là:","o":["Thực hiện cải cách ruộng đất qui mô lớn.","Xóa bỏ giai cấp địa chủ phong kiến ở miền Bắc.","Tiến hành công nghiệp hóa xã hội chủ nghĩa.","Chống chiến tranh phá hoại của đế quốc Mĩ."],"a":2},{"ch":2,"n":55,"q":"Hội nghị Bộ chính trị Trung ương Đảng (9-1953) đề ra kế hoạch Đông - Xuân (1953-1954) với quyết tâm giữ vững quyền chủ động đánh địch trên cả hai mặt trận nào?","o":["Chính trị và ngoại giao.","Chính trị và quân sự.","Quân sự và ngoại giao.","Chính diện và sau lưng địch."],"a":3},{"ch":2,"n":56,"q":"Nhiệm vụ của Cách mạng miền Nam Việt Nam sau 1954 là:","o":["Hàn gắn vết thương chiến tranh, khôi phục và phát triển kinh tế.","Chống lại sự bắn phá và ném bom ác liệt của chính quyền Mĩ- Diệm.","Tiếp tục cuộc cách mạng dân tộc dân chủ nhân dân, thực hiện thống nhất nước nhà.","Tiến hành đấu tranh vũ trang để đánh bại chiến tranh xâm lược của Mĩ, Diệm."],"a":2},{"ch":2,"n":57,"q":"Bộ Chính trị Trung ương Đảng đã lựa chọn địa bàn nào là hướng tiến công chủ yếu trong năm 1975?","o":["Huế.","Phước Long.","Đà Nẵng.","Tây Nguyên."],"a":3},{"ch":2,"n":58,"q":"Sự kiện nào sau đây khiến Đảng ta thay đổi chiến lược từ hoà hoãn với Tưởng để chống Pháp sang hòa hoãn với Pháp để đuổi Tưởng?","o":["Hiệp định Sơ bộ Việt - Pháp được kí kết (6-3-1946).","Hiệp ước Hoa - Pháp được kí kết (28-02-1946).","Tạm ước Việt - Pháp được kí kết (14-9-1946).","Thực dân Pháp nổ súng xâm lược nước ta lần thứ hai (23/9/1945)."],"a":1},{"ch":2,"n":59,"q":"Đông Khê được chọn là nơi mở đầu chiến dịch Biên giới thu - đông năm 1950 của quân dân Việt Nam, vì đó là vị trí:","o":["Ít quan trọng nên quân Pháp không chú ý phòng thủ.","Có thể đột phá, chia cắt tuyến phòng thủ của quân Pháp.","Án ngữ hành lang Đông- Tây của thực dân Pháp.","Quan trọng nhất và tập trung cao nhất binh lực của Pháp."],"a":1},{"ch":2,"n":60,"q":"Lời kêu gọi toàn quốc kháng chiến của chủ tịch Hồ Chí Minh (19/12/1946) đã?","o":["Đưa cách mạng Việt Nam bước vào giai đoạn vừa đánh vừa đàm với Pháp.","Hoàn chỉnh những nội dung của đường lối kháng chiến chống Pháp.","Đáp ứng đòi hỏi khách quan của lịch sử và nguyện vọng của nhân dân.","Làm thất bại âm mưu đánh nhanh thắng nhanh của thực dân Pháp."],"a":2},{"ch":2,"n":61,"q":"Thời cơ chiến lược đã đến, ta có điều kiện hoàn thành sớm quyết tâm giải phóng miền Nam… Đó là Nghị quyết nào của Đảng ta?","o":["Hội nghị Bộ Chính trị mở rộng họp từ 18-12-1974 đến 08-01-1975.","Hội nghị Bộ Chính trị họp từ 30-9 đến 07-10-1974.","Nghị quyết của Bộ Chính trị ngày 25-3-1975.","Hội nghị lần thứ 21 của Trung ương Đảng vào tháng 7-1973."],"a":2},{"ch":2,"n":62,"q":"Nguyên tắc quan trọng nhất của Đảng, Chính phủ và nhân dân Việt Nam trong việc kí Hiệp định Sơ bộ (06/3/1946) và Hiệp định Giơnevơ (21/7/1954) là:","o":["Đảm bảo giành thắng lợi từng bước.","Giữ vững vai trò lãnh đạo của Đảng.","Không vi phạm chủ quyền dân tộc.","Phân hóa và cô lập cao độ kẻ thù."],"a":2},{"ch":2,"n":63,"q":"Hội nghị lần thứ 15 Ban chấp hành Trung ương Đảng (01/1959) đã để lại bài học kinh nghiệm nào cho Đảng trong quá trình lãnh đạo cách mạng Việt Nam?","o":["Sử dụng bạo lực cách mạng giành chính quyền về tay nhân dân.","Sử dụng con đường đấu tranh ngoại giao giành chính quyền.","Sử dụng con đường đấu tranh vũ trang giành chính quyền.","Sử dụng con đường đấu tranh chính trị kết hợp đấu tranh vũ trang."],"a":0},{"ch":2,"n":64,"q":"Vì sao Bộ Chính trị Trung ương Đảng lựa chọn Tây Nguyên là hướng tiến công chiến lược đầu tiên trong cuộc Tổng tiến công và nổi dậy Xuân 1975?","o":["Chiếm được Tây Nguyên sẽ cắt đôi chiến trường miền Nam.","Tây Nguyên là căn cứ liên hợp quân sự mạnh nhất của Mĩ - Ngụy ở miền Nam.","Tây Nguyên có vị trí chiến lược quan trọng, địch tập trung lực lượng dày đặc.","Tây Nguyên là địa bàn chiến lược quan trọng, nhưng lực lượng địch mỏng bố trí sơ hở."],"a":3},{"ch":2,"n":65,"q":"Hội nghị lần thứ 15 Ban Chấp hành Trung ương Đảng Lao động Việt Nam (1- 1959) quyết định để nhân dân miền Nam sử dụng bạo lực cách mạng là vì:","o":["Lực lượng vũ trang cách mạng miền Nam đã phát triển.","Ta không thể tiếp tục sử dụng biện pháp hoà bình được nữa.","Miền Nam đã có lực lượng chính trị và lực lượng vũ trang lớn mạnh.","Mĩ và chính quyền Sài Gòn phá hoại Hiệp định Giơnevơ."],"a":1},{"ch":2,"n":66,"q":"Nhận xét nào sau đây là đúng về bản Hiệp định Sơ bộ (6/3/1946)?","o":["Công nhận Việt Nam là một quốc gia tự do, có quyền dân tộc tự quyết.","Là sách lược của Việt Nam để kéo dài thời gian hòa hoãn với Pháp.","Chuyển Pháp từ vị trí đối tác thành đối tượng của cách mạng Việt Nam.","Biến hiệp ước 2 bên thành thỏa thuận 3 bên có lợi cho cách mạng."],"a":3},{"ch":2,"n":67,"q":"Chỉ thị \"Kháng chiến kiến quốc\" (25/11/1945) của Ban Chấp hành Trung ương Đảng xác định kẻ thù chính của chúng ta lúc này là?","o":["Thực dân Pháp","Thực dân Anh","Trung Hoa Dân Quốc","Phát xít Nhật"],"a":0},{"ch":2,"n":68,"q":"Trong kháng chiến chống Pháp, đường lối kháng chiến xác định có 4 điểm: toàn dân, toàn diện, lâu dài, tự lực cánh sinh.4 điểm trên thuộc:","o":["Mục đích kháng chiến","Tính chất kháng chiến","Chính sách kháng chiến","Phương châm tiến hành kháng chiến"],"a":3},{"ch":2,"n":69,"q":"Vận mệnh dân tộc Việt Nam sau khi Cách mạng tháng Tám 1945 thành công được ví như","o":["Ngàn cân treo sợi tóc","Nước sôi lửa nóng","Nước sôi lửa bỏng","Trứng nước"],"a":0},{"ch":2,"n":70,"q":"Chủ tịch Hồ Chí Minh ra “Lời kêu gọi toàn quốc kháng chiến” vào thời điểm nào?","o":["Đêm ngày 18/12/1946","Đêm ngày 19/12/1946","Ngày 20/12/1946","Cả 3 phương án đều sai"],"a":1},{"ch":2,"n":71,"q":"Đại hội Đại biểu lần thứ II của Đảng (2/1951) đã thông qua bản Cương lĩnh nào?","o":["Chính cương văn tắt, sách lược vắn tắt","Cương lĩnh 3/2","Chính Cương của Đảng Lao động Việt Nam","Luận cương chính trị tháng 10/1930"],"a":2},{"ch":2,"n":72,"q":"Trong các nguyên nhân thắng lợi của cuộc kháng chiến chống thực dân Pháp xâm lược, nguyên nhân nào là căn bản nhất?","o":["Có sự lãnh đạo đúng đắn của Đảng","Có lực lượng vũ trang bao gồm ba thứ quân chiến đấu dũng cảm, mưu lược","Có chính quyền dân chủ nhân dân tổ chức toàn dân kháng chiến và xây dựng chế độ mới","Có sự liên minh đoàn kết keo sơn giữa ba dân tộc Việt Nam, Lào, Campuchia."],"a":0},{"ch":2,"n":73,"q":"Trong cuộc Tổng tiến công và nổi dậy Xuân 1975, trận đánh \"điểm huyệt\" của quân đội và Nhân dân Việt Nam trên chiến trường Tây Nguyên diễn ra ở","o":["Plâycu","An Khê","Kontum","Buôn Ma Thuột"],"a":3},{"ch":2,"n":74,"q":"Đường lối chiến lược chung của cách mạng Việt Nam được thông qua tại Đại hội III của Đảng (9/1960) xác định vai trò của cách mạng miền Bắc đối với cách mạng cả nước là?","o":["Vai trò quyết định","Vai trò quyết định nhất","Vai trò quyết định trực tiếp","Tất cả các phương án trên"],"a":1},{"ch":2,"n":75,"q":"Văn kiện nào dưới đây được coi như Cương lĩnh kháng chiến của Đảng ta?","o":["Lời kêu gọi toàn quốc kháng chiến của Chủ tịch Hồ Chí Minh","Chỉ thị toàn dân kháng chiến của Trung ương Đảng","Tác phẩm \"Kháng chiến nhất định thắng lợi\" của Tổng Bí thư Trường Chinh","Cả 3 phương án trên"],"a":3},{"ch":2,"n":76,"q":"Tính đến năm 1986, nước ta có mấy bản cương lĩnh?","o":["2","3","4","5"],"a":1},{"ch":2,"n":77,"q":"Thắng lợi của cuộc kháng chiến chống Mỹ, cứu nước đã để lại cho Đảng ta nhiều bài học kinh nghiệm có giá trị về lãnh đạo và chỉ đạo cách mạng. Bài học nào sau đây trực tiếp dẫn tới thắng lợi Mỹ cút, ngụy nhào?","o":["Giương cao ngọn cờ độc lập dân tộc và chủ nghĩa xã hội","Kiên định tư tưởng chiến lược tiến công, quyết đánh và quyết thắng đế quốc Mỹ xâm lược","Thực hiện chiến tranh nhân dân, tìm ra biện pháp chiến đấu đúng đắn, linh hoạt, sáng tạo","Coi trọng công tác tổ chức, công tác xây dựng Đảng"],"a":1},{"ch":2,"n":78,"q":"Nguyên nhân nào sau đây không phải là nguyên nhân quan trọng đưa tới thắng lợi của cuộc kháng chiến chống Mỹ, cứu nước?","o":["Cuộc chiến đấu gian khổ, hy sinh của nhân dân, quân đội cả nước, đặc biệt của cán bộ, chiến sĩ và hàng chục triệu đồng bào yêu nước ở miền Nam.","Công cuộc xây dựng và bảo vệ hậu phương miền Bắc XHCN của đồng bào và chiến sĩ miền Bắc","Tình đoàn kết chiến đấu của nhân dân ba nước Việt Nam, Lào, Campuchia và sự ủng hộ của nhân dân thế giới","Có bối cảnh quốc tế thuận lợi, kẻ địch bị khủng hoảng về kinh tế"],"a":3},{"ch":2,"n":79,"q":"Từ sau ngày 2/9/1945 đến trước ngày 6/3/1946, Đảng, Chính phủ, chủ tịch Hồ Chí Minh đã chủ trương tạm thời hòa hoãn với:","o":["Trung Hoa Dân quốc","Thực dân Pháp","Phát xít Nhật","Thực dân Anh"],"a":0},{"ch":3,"n":1,"q":"Nội dung của Ba chương trình kinh tế lớn từ năm 1986 là:","o":["Hàng hóa tiêu dùng, hàng xuất khẩu và máy móc.","Lương thực - thực phẩm, hàng tiêu dùng và hàng xuất khẩu.","Lương thực - thực phẩm, hàng tiêu dùng và máy móc.","Máy móc, lương thực - thực phẩm và hàng xuất khẩu."],"a":1},{"ch":3,"n":2,"q":"Nội dung nào là một trong những quyết định của kì họp thứ nhất Quốc hội khóa VI nước Việt Nam thống nhất (24/6 đến 3/7/1976)?","o":["Tạo điều kiện thuận lợi để cả nước đi lên chủ nghĩa xã hội.","Quyết định Tên nước là Cộng hòa xã hội chủ nghĩa Việt Nam.","Mở ra những khả năng to lớn để bảo vệ Tổ quốc.","Tuyên bố Nước Việt Nam dân chủ cộng hòa thành lập."],"a":1},{"ch":3,"n":3,"q":"Tại Đại hội lần thứ IX (4-2001), Đảng chủ trương thực hiện nhất quán và lâu dài mô hình kinh tế tổng quát của Việt Nam trong thời kì quá độ đi lên CNXH là:","o":["Nền kinh tế kế hoạch hóa tập trung quan lieu.","Nền kinh tế thị trường định hướng TBCN.","Nền kinh tế độc quyền do Nhà nước kiểm soát.","Nền kinh tế thị trường định hướng xã hội chủ nghĩa."],"a":3},{"ch":3,"n":4,"q":"Hội nghị Hiệp thương chính trị thống nhất đất nước được tổ chức tại Sài Gòn (11-1975) đã:","o":["Quyết định đặt tên nước là Cộng hòa xã hội chủ nghĩa Việt Nam","Thông qua chính sách đối nội, đối ngoại của nước Việt Nam thống nhất.","Nhất trí hoàn toàn các chủ trương, biện pháp thống nhất đất nước về mặt nhà nước.","Bầu các cơ quan lãnh đạo cao nhất, Ban dự thảo Hiến pháp."],"a":2},{"ch":3,"n":5,"q":"Cương lĩnh xây dựng đất nước trong thời kỳ quá độ đi lên chủ nghĩa xã hội được thông qua tại Đại hội:","o":["Đại hội đại biểu toàn quốc lần thứ V (3-1981).","Đại hội đại biểu toàn quốc lần thứ VI (12-1986).","Đại hội đại biểu toàn quốc lần thứ VII (6-1991).","Đại hội đại biểu toàn quốc lần thứ IV (12-1976)."],"a":2},{"ch":3,"n":6,"q":"Việc hoàn thành thống nhất đất nước về mặt nhà nước ở Việt Nam (1976) đã:","o":["Đánh dấu việc hoàn thành thống nhất các tổ chức chính trị - xã hội.","Tạo khả năng to lớn để mở rộng quan hệ với các nước trên thế giới.","Thể hiện mong muốn được gia nhập tổ chức ASEAN của Việt Nam.","Tạo điều kiện tiếp tục hoàn thành cuộc cách mạng giải phóng dân tộc."],"a":1},{"ch":3,"n":7,"q":"Sự kiện nào đánh dấu công cuộc thống nhất đất nước về mặt nhà nước đã hoàn thành?","o":["Hội nghị Hiệp thương chính trị thống nhất đất nước (1975).","Cuộc Tổng tuyển cử bầu Quốc hội chung (1976).","Đại hội đại biểu toàn quốc lần thứ IV (1976).","Kì họp đầu tiên Quốc hội khóa VI (1976)."],"a":3},{"ch":3,"n":8,"q":"Từ sau năm 1975 tới nay, sự kiện nào đã đánh dấu bước ngoặt mới cho sự phát triển của lịch sử dân tộc Việt Nam?","o":["Xây dựng và phát triển đất nước.","Đường lối đổi mới của Đảng năm 1986.","Xây dựng và bảo vệ Tổ quốc.","Đẩy mạnh công nghiệp hóa, hiện đại hóa."],"a":1},{"ch":3,"n":9,"q":"Nguyện vọng, tình cảm thiêng liêng của nhân dân hai miền Nam – Bắc Việt Nam sau đại thắng mùa Xuân 1975 là:","o":["Đánh thắng hoàn toàn giặc Mĩ xâm lược.","Công nghiệp hóa, hiện đại hóa đất nước.","Sớm được sum họp trong một đại gia đình.","Xây dựng thành công xã hội chủ nghĩa."],"a":2},{"ch":3,"n":10,"q":"Một trong những khó khăn, yếu kém của công cuộc đổi mới từ năm 1986 đến năm 1990 là:","o":["Tình trạng tham nhũng mới khắc phục gần hết.","Sự nghiệp văn hóa có sự cải thiện.","Kinh tế mất cân đối, lạm phát ở mức cao.","Tích lũy nội bộ nền kinh tế chưa nhiều."],"a":2},{"ch":3,"n":11,"q":"Trong mục tiêu tổng quát, Nghị quyết Đại hội lần thứ XII đã thống nhất cần: Đẩy mạnh toàn diện, đồng bộ công cuộc đổi mới; phát triển kinh tế nhanh, bền vững, phấn đấu sớm đưa nước ta…","o":["Trở thành một nước công nghiệp hiện đại.","Trở thành nước hiện đại nhất châu Á.","Cơ bản trở thành nước công nghiệp theo hướng hiện đại.","Trở thành nước công nghiệp đứng đầu châu Á."],"a":2},{"ch":3,"n":12,"q":"Nội dung nào KHÔNG nói lên ý nghĩa của việc hoàn thành thống nhất về mặt Nhà nước sau đại thắng mùa Xuân 1975?","o":["Tạo điều kiện thuận lợi để cả nước đi lên xây dựng chủ nghĩa xã hội.","Chứng tỏ sự ủng hộ to lớn của quốc tế với công cuộc xây dựng chủ nghĩa xã hội của ta.","Tạo những điều kiện chính trị cơ bản để phát huy sức mạnh toàn diện của đất nước.","Mở ra khả năng to lớn để bảo vệ Tổ quốc và mở rộng quan hệ quốc tế."],"a":1},{"ch":3,"n":13,"q":"Một trong những quan điểm được đề ra trong Chiến lược phát triển kinh tế - xã hội 2011 - 2020?","o":["Phát triển nhanh gắn liền với phát triển bền vững, phát triển bền vững là yêu cầu xuyên suốt trong Chiến lược.","Tăng đầu tư của Nhà nước, đồng thời đẩy mạnh huy động các nguồn lực của xã hội để phát triển văn hoá, xã hội.","Phát huy dân chủ, khơi dậy sức mạnh tổng hợp của toàn dân tộc, kết hợp sức mạnh dân tộc với sức mạnh thời đại.","Hoàn thiện thể chế kinh tế thị trường định hướng xã hội chủ nghĩa, trọng tâm là tạo lập môi trường cạnh tranh bình đẳng và cải cách hành chính."],"a":0},{"ch":3,"n":14,"q":"Những thành tựu Việt Nam đạt được trong việc thực hiện kế hoạch 5 năm 1986-1990 chứng tỏ điều gì?","o":["Đường lối đổi mới là đúng, bước đi của công cuộc đổi mới cơ bản là phù hợp.","Việt Nam đã giải quyết được sự mất cân đối của nền kinh tế.","Đường lối đổi mới về cơ bản là đúng đắn, cần phải có những bước đi phù hợp.","Việt Nam đã thoát khỏi tình trạng khủng hoảng kinh tế - xã hội."],"a":0},{"ch":3,"n":15,"q":"Sự kiện nào là quan trọng nhất trong quá trình thống nhất đất nước về mặt nhà nước sau năm 1975?","o":["Hội nghị Hiệp thương của đại biểu hai miền Nam - Bắc tại Sài Gòn.","Tổng tuyển cử bầu Quốc hội chung trong cả nước.","Đại hội thống nhất mặt trận Tổ quốc Việt Nam.","Quốc hội khóa VI của nước Việt Nam thống nhất họp phiên đầu tiên."],"a":3},{"ch":3,"n":16,"q":"Phát biểu nào sau đây không đúng về đường lối đổi mới trên lĩnh vực chính trị:","o":["Thực hiện chính sách đoàn kết kết dân tộc, đoàn kết quốc tế.","Xây dựng Nhà nước pháp quyền xã hội chủ nghĩa.","Mở rộng quan hệ kinh tế đối ngoại với tất cả các quốc gia.","Thực hiện chính sách đối ngoại hòa bình, hữu nghị, hợp tác."],"a":2},{"ch":3,"n":17,"q":"Vì sao nói đổi mới đất nước là một tất yếu khách quan.","o":["Đất nước ta lâm vào cuộc khủng hoảng kinh tế xã hội trầm trọng.","Đổi mới là yêu cầu cấp bách thường xuyên của cách mạng Việt Nam.","Tác động của cuộc cách mạng khoa học công nghệ trên thế giới.","Tình hình thế giới có nhiều chuyển biến lớn từ Liên Xô."],"a":0},{"ch":3,"n":18,"q":"Đại hội nào của Đảng khẳng định: Tư tưởng Hồ Chí Minh không chỉ là kết quả của sự vận dụng sáng tạo mà còn phát triển sáng tạo chủ nghĩa Mác - Lênin?","o":["Đại hội IX.","Đại hội VI.","Đại hội VII.","Đại hội VIII"],"a":0},{"ch":3,"n":19,"q":"Năm 1986, Đảng và Nhà nước Việt Nam tiến hành đổi mới đất nước nhằm:","o":["Xây dựng và bảo vệ chính quyền cách mạng.","Giải quyết nạn đói, nạn dốt.","Giải quyết khó khăn về tài chính.","Khắc phục sai lầm, khuyết điểm."],"a":3},{"ch":3,"n":20,"q":"Thành tựu quan trọng nhất trong bước đầu thực hiện công cuộc đổi mới (12-1986) là:","o":["Thực hiện được mục tiêu Ba chương trình kinh tế lớn.","Từng bước đưa đất nước thoát khỏi khủng hoảng kinh tế - xã hội.","Tập trung phát triển kinh tế đối ngoại.","Kiềm chế được lạm phát về kinh tế."],"a":1},{"ch":3,"n":21,"q":"Văn kiện Đại hội XIII định hướng bảo vệ Tổ quốc giai đoạn 2021-2030 như thế nào?","o":["Kiên quyết, kiên trì bảo vệ vững chắc độc lập, tự do của Tổ quốc.","Kiên quyết, kiên trì bảo vệ vững chắc độc lập, chủ quyền biển đảo của Tổ quốc.","Kiên quyết, kiên trì bảo vệ vững chắc độc lập, chủ quyền vùng trời, vùng biển của Tổ quốc.","Kiên quyết, kiên trì bảo vệ vững chắc độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ của Tổ quốc."],"a":3},{"ch":3,"n":22,"q":"Nhận định nào đúng về Đại hội đại biểu toàn quốc lần thứ VI của Đảng?","o":["Đại hội toàn thắng của sự nghiệp giải phóng dân tộc, thống nhất Tổ quốc, đưa cả nước tiến lên CNXH.","Đại hội của trí tuệ - đổi mới, dân chủ - kỷ cương - đoàn kết trách nhiệm trong mọi lĩnh vực.","Đại hội khởi xướng đường lối đổi mới toàn diện, đánh dấu bước phát triển mới trong thời kỳ quá độ lên chủ nghĩa xã hội.","Đại hội có bước phát triển nhận thức mới, các bước đột phá tiếp tục đổi mới về kinh tế."],"a":2},{"ch":3,"n":23,"q":"Về công tác xây dựng Đảng nhiệm kỳ 2021 – 2026, Nghị quyết Đại hội XIII của Đảng xác định có bao nhiêu nhiệm vụ trọng tâm và giải pháp đột phá?","o":["4 nhiệm vụ trọng tâm và 4 giải pháp đột phá.","3 nhiệm vụ trọng tâm và 4 giải pháp đột phá.","3 nhiệm vụ trọng tâm và 3 giải pháp đột phá.","4 nhiệm vụ trọng tâm và 3 giải pháp đột phá."],"a":2},{"ch":3,"n":24,"q":"Đâu là điểm chung trong quyết định của Quốc hội khóa VI và Quốc Hội khóa I?","o":["Thành lập chính phủ Liên Hiệp kháng chiến.","Lấy tên nước là Cộng hòa xã hội chủ nghĩa Việt Nam.","Thành lập Quân đội Quốc gia Việt Nam.","Bầu Ban dự thảo Hiến pháp."],"a":3},{"ch":3,"n":25,"q":"Đâu là nhận xét đúng về Cương lĩnh 2011 của Đảng?","o":["Là Cương lĩnh hoàn thiện về lý luận về đường lối đổi mới.","Là Cương lĩnh đầu tiên của Đảng kể từ năm 1930.","Là Cương lĩnh đề ra chủ trương công nghiệp hóa.","Là Cương lĩnh khởi xướng đường lối đổi mới."],"a":0},{"ch":3,"n":26,"q":"So với Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam (1991), Cương lĩnh bổ sung phát triển năm 2011 nêu thêm đặc trưng của chủ nghĩa xã hội mà nhân dân Việt Nam xây dựng là:","o":["do nhân dân lao động làm chủ và có kinh tế phát triển.","có nền văn hóa tiên tiến và đậm đà bản sắc dân tộc.","dân giàu, nước mạnh, dân chủ, công bằng, văn minh.","có quan hệ hữu nghị hợp tác với các nước trên thế giới."],"a":2},{"ch":3,"n":27,"q":"Nội dung nào là một trong những quyết định của kì họp thứ nhất Quốc hội khóa VI nước Việt Nam thống nhất (24/6 - 3/7/1976)?","o":["Quốc huy mang dòng chữ Cộng hòa xã hội chủ nghĩa Việt Nam.","Tạo điều kiện thuận lợi để cả nước đi lên chủ nghĩa xã hội.","Tuyên bố Nước Việt Nam dân chủ cộng hòa thành lập.","Mở ra những khả năng to lớn để bảo vệ Tổ quốc."],"a":0},{"ch":3,"n":28,"q":"Trong đường lối đổi mới đất nước (12-1986), Đảng Cộng sản Việt Nam xác định trọng tâm của công cuộc đổi mới là:","o":["Tư tưởng.","Chính trị.","Văn hóa.","Kinh tế."],"a":3},{"ch":3,"n":29,"q":"Đường lối đổi mới được thông qua lần đầu tiên tại:","o":["Đại hội VIII (7/1996).","Đại hội VII (6/1991).","Đại hội V (3-1981).","Đại hội VI (12-1986)."],"a":3},{"ch":3,"n":30,"q":"Đại hội nào của Đảng được gọi là Đại hội “Trí tuệ- đổi mới, dân chủ - kỉ cương - đoàn kết”.","o":["Đại hội đại biểu toàn quốc lần thứ VI (12-1986).","Đại hội đại biểu toàn quốc lần thứ VII (6-1991).","Đại hội đại biểu toàn quốc lần thứ V (3-1981).","Đại hội đại biểu toàn quốc lần thứ IV (12-1976)."],"a":1},{"ch":3,"n":31,"q":"Đại hội Đại biểu toàn quốc lần thứ IV của Đảng (12/1976) đề ra đường lối:","o":["Khôi phục và bước đầu phát triển kinh tế tư bản chủ nghĩa trên cả nước.","Xây dựng chủ nghĩa xã hội trong phạm vi cả nước.","Xây dựng chủ nghĩa xã hội ở miền Bắc, một phần ở miền Nam","Cải tạo xã hội chủ nghĩa trong giai đoạn xây dựng đất nước."],"a":1},{"ch":3,"n":32,"q":"Sau ngày đất nước thống nhất 1975, các kì Đại hội Đảng sẽ được tổ chức ở đâu?","o":["Thành phố Hồ Chí Minh.","Hải Phòng.","Đà Nẵng.","Hà Nội."],"a":3},{"ch":3,"n":33,"q":"Nguyên nhân khách quan nào sau đây thúc đẩy Đảng và Nhà nước ta phải tiến hành đổi mới?","o":["Khắc phục tình trạng khủng hoảng kinh tế- xã hội trong nước.","Do tác động của cuộc cách mạng khoa học công nghệ.","Do nền kinh tế Việt Nam kém phát triển, mất cân đối.","Do con người Việt Nam cảm thấy cần đổi mới để thay đổi cuộc sống."],"a":1},{"ch":3,"n":34,"q":"“Việt Nam là bạn, đối tác tin cậy của các nước trong cộng đồng quốc tế, tham gia tích cực vào tiến trình hợp tác quốc tế và khu vực” là chủ trương của đại hôi X trên lĩnh vực nào?","o":["Chính trị.","Đối ngoại.","Văn hóa.","Kinh tế."],"a":1},{"ch":3,"n":35,"q":"Cho các dữ liệu sau:1. Hội nghị lần thứ 24 của Đảng đề ra nhiệm vụ hoàn thành thống nhất đất nước về mặt nhà nước.2. Hội nghị Hiệp thương chính trị thống nhất đất nước tổ chức tại Sài Gòn.3. Quốc hội khóa VI nước Việt Nam thống nhất họp kì đầu tiên tại Hà Nội.Sắp xếp các dữ liệu theo thứ tự thời gian thể hiện quá trình thống nhất đất nước về mặt nhà nước.”","o":["3,1,2.","2,3,1.","1,2,3.","2,1,3."],"a":2},{"ch":3,"n":36,"q":"Nội dung đổi mới về kinh tế ở Việt Nam (12-1986) và Chính sách kinh tế mới (NEP, 1921) ở nước Nga có điểm tương đồng là:","o":["Xây dựng kinh tế thị trường xã hội chủ nghĩa, kiểm soát bằng pháp luật.","Thay chế độ trưng thu lương thực thừa bằng thuế lương thực.","Ưu tiên phát triển công nghiệp nặng và giao thông vận tải.","Xây dựng nền kinh tế nhiều thành phần có sự quản lý của nhà nước."],"a":3},{"ch":3,"n":37,"q":"Thành tựu nổi bật về lương thực-thực phẩm trong kế hoạch Nhà nước 5 năm 1986-1990 ở Việt Nam là gì?","o":["Bước đầu hình thành nền kinh tế nhiều thành phần.","Hàng hóa trên thị trường dồi dào, đa dạng.","Nhiều mặt hành có giá trị xuất khẩu lớn.","Đáp ứng nhu cầu trong nước, có dự trữ và xuất khẩu."],"a":3},{"ch":3,"n":38,"q":"Đại hội XIII nhận định chung về tình hình đất nước sau 35 năm đổi mới:","o":["Đất nước ta chưa bao giờ có cơ đồ, vị thế và uy tín quốc tế như ngày nay.","Đất nước ta chưa bao giờ có cơ đồ, vị thế, tiềm lực và uy tín quốc tế như ngày nay.","Đất nước ta chưa bao giờ có cơ đồ, tiềm lực và uy tín quốc tế như ngày nay.","Đất nước ta chưa bao giờ có cơ đồ, tiềm lực, vị thế và uy tín quốc tế như ngày nay."],"a":3},{"ch":3,"n":39,"q":"Hội nghị lần thứ 24 Ban chấp hành Trung ương Đảng Lao Động Việt Nam (9/1975) đã đề ra nhiệm vụ gì?","o":["Xây dựng chủ nghĩa xã hội ở miền Bắc.","Tiếp tục cách mạng dân tộc dân chủ nhân dân ở miền Nam.","Dùng bạo lực đánh đổ Mĩ - Diệm.","Thống nhất đất nước về mặt nhà nước."],"a":3},{"ch":3,"n":40,"q":"Tình hình thế giới và trong nước những năm 80 của thế kỉ XX đã đặt ra yêu cầu cấp bách nào đối với Việt Nam?","o":["Hoàn thành tập thể hóa nông nghiệp.","Tiến hành công cuộc đổi mới toàn diện.","Hoàn thành công nghiệp hóa, hiện đại hóa đất nước.","Tập trung phát triển công nghiệp nặng."],"a":1},{"ch":3,"n":41,"q":"Sau khi cuộc kháng chiến chống Mĩ cứu nước kết thúc, yếu tố nào còn tồn tại trái với nguyện vọng, tình cảm thiêng liêng của nhân dân Việt Nam?","o":["Nền kinh tế phát triển không cân đối, lệ thuộc vào viện trợ của nước ngoài.","Mỗi miền đất nước vẫn tồn tại hình thức tổ chức nhà nước khác nhau.","Đất nước chưa thống nhất về mặt lãnh thổ, tiềm lực quốc gia còn yếu.","Mĩ không trao trả tù binh bị bắt, không hàn gắn vết thương chiến tranh."],"a":1},{"ch":3,"n":42,"q":"Tinh thần gì được phát huy qua hai cuộc Tổng tuyển cử bầu Quốc hội năm 1946 và 1976?","o":["Đoàn kết với Lào và Campuchia.","Yêu nước chống ngoại xâm.","Tinh thần đoàn kết quốc tế vô sản.","Tinh thần đại đoàn kết dân tộc."],"a":3},{"ch":3,"n":43,"q":"“Đoàn kết – Dân chủ – Kỷ cương – Sáng tạo – Phát triển” là gì của Đại hội XIII của Đảng?","o":["Chủ đề của Đại hội Đảng lần thứ XIII.","Mục tiêu chỉ đạo của Đại hội Đảng XIII.","Quan điểm chỉ đạo của Đại hội Đảng XIII.","Phương châm chỉ đạo của Đại hội Đảng XIII."],"a":3},{"ch":3,"n":44,"q":"Trong 15 năm (1986-2000) thực hiện đường lối đổi mới, những thành tựu về kinh tế- xã hội mà người Việt Nam đạt được có ý nghĩa như thế nào?","o":["Đưa Việt Nam tham gia nhanh chóng vào xu thế trật tự đa cực.","Định hướng con đường phát triển cho các quốc gia trên thế giới.","Góp phần chấm dứt mưu đồ chống phá của các thế lực thù địch.","Củng cố vững chắc độc lập dân tộc và chế độ xã hội chủ nghĩa."],"a":3},{"ch":3,"n":45,"q":"Bài học kinh nghiệm lớn nhất được rút ra từ thắng lợi của cuộc Tổng tuyển cử bầu Quốc hội khóa I và khóa VI ở nước ta là gì?","o":["Phát huy quyền làm chủ nhân dân, không ngừng chăm lo, bồi dưỡng sức dân.","Không ngừng xây dựng, củng cố chính quyền nhân dân các cấp.","Tăng cường xây dựng, nâng cao sức chiến đấu của Đảng.","Đẩy mạnh công tác tuyên truyền, giáo dục tư tưởng chính trị cho nhân dân."],"a":0},{"ch":3,"n":46,"q":"Đại hội nào coi nông nghiệp là mặt trận hàng đầu?","o":["Đại hội đại biểu toàn quốc lần thứ V (3-1981).","Đại hội đại biểu toàn quốc lần thứ VII (6-1991).","Đại hội đại biểu toàn quốc lần thứ VI (12-1986).","Đại hội đại biểu toàn quốc lần thứ IV (12-1976)."],"a":0},{"ch":3,"n":47,"q":"Khẩu hiệu “Đoàn kết - Dân chủ - Kỉ cương - Đổi mới” lần đầu tiên xuất hiện tại:","o":["Đại hội đại biểu toàn quốc lần thứ XIII.","Đại hội đại biểu toàn quốc lần thứ XI.","Đại hội đại biểu toàn quốc lần thứ XII.","Đại hội đại biểu toàn quốc lần thứ X."],"a":2},{"ch":3,"n":48,"q":"Lần đầu tiên, Đại hội đại biểu toàn quốc lần thứ V (3/1982) của Đảng xác định thời kì quá độ đi lên CNXH ở Việt Nam là khó khăn, phức tạp, lâu dài, phải trải qua:","o":["Nhiều bước quá độ.","Ba chặng đường.","Nhiều chặng đường.","Hai chặng đường."],"a":2},{"ch":3,"n":49,"q":"Nội dung nào không nằm trong đường lối đổi mới về kinh tế của Đảng Cộng sản Việt Nam từ Đại hôi VI (12/1986).","o":["Xây dựng nền kinh tế với cơ cấu nhiều quy mô.","Ưu tiên đầu tư phát triển công nghiệp nặng.","Mở rộng và phát triển quan hệ kinh tế đối ngoại.","Hình thành kinh tế thị trường định hướng XHCN."],"a":1},{"ch":3,"n":50,"q":"Khoán 100 đã ra đời sau bước đột phát nào của Đảng về kinh tế?","o":["Bước đột phá thứ hai về đổi mới kinh tế của Đảng (6/1985).","Bước đột phá thứ tư về đổi mới kinh tế của Đảng (6/1987).","Bước đột phá đầu tiên về đổi mới kinh tế của Đảng (8/1979).","Bước đột phá thứ ba về đổi mới kinh tế của Đảng (8/1986)."],"a":2},{"ch":3,"n":51,"q":"Nhận định nào đúng về ý nghĩa của Đại hội đại biểu toàn quốc lần thứ VI của Đảng cộng sản Việt Nam (12/1986)?","o":["Chuẩn bị những tiền đề cần thiết để Đảng đề ra đường lối đổi mới.","Đưa đất nước vào thời kì đẩy mạnh công nghiệp hóa- hiện đại hóa đất nước.","Mở ra một bước ngoặt trên con đường quá độ lên chủ nghĩa xã hội.","Bước đầu đưa đất nước phát triển theo con đường xã hội chủ nghĩa."],"a":2},{"ch":3,"n":52,"q":"Vấn đề hoàn thành thống nhất đất nước về mặt Nhà nước ở Việt Nam sau đại thắng mùa Xuân 1975 trở nên cấp thiết do:","o":["Yêu cầu của cuộc đấu tranh chống tập đoàn Pôn - Pốt.","Yêu cầu của sự nghiệp xây dựng và bảo vệ Tổ quốc.","Mĩ can thiệp vào công việc nội bộ của hai miền.","Ranh giới chia cắt hai miền đất nước chưa bị xóa bỏ."],"a":1},{"ch":3,"n":53,"q":"Kế hoạch nhà nước 5 năm (1976-1980) nhân dân Việt Nam là: vừa xây dựng chủ nghĩa xã hội vừa:","o":["Cải tạo quan hệ sản xuất xã hội chủ nghĩa.","Khắc phục hậu quả của chiến tranh.","Khôi phục kinh tế.","mở cửa, hội nhập với thế giới."],"a":0},{"ch":3,"n":54,"q":"Phát biểu ý kiến của anh (chị) về nhận định sau: “thống nhất đất nước vừa là nguyện vọng tha thiết bậc nhất của nhân dân, vừa là quy luật khách quan của lịch sử Việt Nam”?","o":["Đúng, vì đều tiến hành sau thắng lợi của cuộc đấu tranh chống ngoại xâm.","Đúng, vì thực tế lịch sử Việt Nam đã chứng minh quy luật thống nhất là đúng và đa số người dân đều ủng hộ thống nhất khi 98,8% cử tri đi bỏ phiếu.","Sai, vì thực tế có hàng loạt người dân miền Nam đã di cư ra nước ngoài do không muốn thống nhất đất nước.","Đúng, vì thống nhất đất nước là nguyện vọng của những người lãnh đạo miền Bắc Việt Nam."],"a":1},{"ch":3,"n":55,"q":"Đâu là nhận xét đúng về chủ trương mở rộng, đa dạng hoá và đa phương hoá quan hệ đối ngoại của Đảng?","o":["Là chủ trương phù hợp, kịp thời lần đầu tiên được đưa ra ở đại hôi Đảng lần thứ V (3-1982).","Là chủ trương xuyên xuốt, kịp thời lần đầu tiên được đưa ra ở đại hôi Đảng lần thứ VIII (7-1996).","Là chủ trương quan trọng lần đầu tiên được đưa ra tại đại hội VII (6/1991).","Là chủ trương đúng đắn, kịp thời của Đảng được đưa ra lần đầu tiên ở đại hội VI (12-1986)."],"a":3},{"ch":3,"n":56,"q":"Tên nước Cộng hòa xã hội chủ nghĩa Việt Nam được thông qua tại sự kiện chính trị nào?","o":["Hội nghị lần thứ 24 Ban Chấp hành Trung ương Đảng (9-1975).","Hội nghị Hiệp thương chính trị thống nhất đất nước (11-1975).","Cuộc Tổng tuyển cử bầu Quốc hội chung (4-1976).","Kì họp thứ nhất Quốc hội khóa VI nước Việt Nam thống nhất (7-1976)."],"a":3},{"ch":3,"n":57,"q":"Chính sách nào nói về đổi mới kinh tế trong Đại hội VI (1986)?","o":["Xóa bỏ cơ chế tập trung quan liêu, hành chính, bao cấp chuyển sang hạch toán, kinh doanh kết hợp kế hoạch với thị trường","Chăm lo đáp ứng các nhu cầu giáo dục, văn hóa, bảo vệ và tăng cường sức khỏe của nhân dân","Tăng cường tình hữu nghị và hợp tác toàn diện với Liên Xô và các nước xã hội chủ nghĩa","Đảng cần phát huy quyền làm chủ tập thể của nhân dân lao động, quán triệt tư tưởng “lấy dân làm gốc”; tăng cường hiệu lực quản lý của Nhà nước là điều kiện tất yếu để huy động lực lượng của quần chúng"],"a":0},{"ch":3,"n":58,"q":"Tại đại hội lần thứ VI (12-1986) Đảng tổng kết một trong những bài học kinh nghiệm rút ra trong toàn bộ hoạt động của mình là Đảng cần phải quán triệt tư tưởng:","o":["Cán bộ là gốc.","Con người là vốn.","Giáo dục là gốc.","Lấy dân làm gốc."],"a":3},{"ch":3,"n":59,"q":"Cuộc tổng tuyển cử bầu Quốc hội chung của nước Việt Nam thống nhất được tiến hành vào ngày nào?","o":["25/4/1976","25/4/1977","25/4/1975","6/01/1946"],"a":0},{"ch":3,"n":60,"q":"Đại hội lần thứ V của Đảng khẳng định điều gì?","o":["Tiếp tục thực hiện đường lối Cách mạng XHCN đã vạch ra đại hội lần thứ IV","Thực hiện công cuộc đổi mới đất nước.","Thực hiện công cuộc Công nghiệp hoá và hiện đại hoá đất nước","Tất cả đều đúng"],"a":0},{"ch":3,"n":61,"q":"Tại Đại hội đại biểu toàn quốc lần thứ VI (12/1986), Đảng Cộng sản đề ra chủ trương đổi mới về kinh tế là:","o":["mở rộng kinh tế đối ngoại, thực hiện chính sách đoàn kết dân tộc.","phát triển kinh tế hàng hoá nhiều thành phần theo định hướng XHCN.","xây dựng cơ chế kinh tế tập trung bao cấp, từng bước hình thành kinh tế thị trường.","thực hiện cơ chế kinh tế tập trung quan liêu bao cấp, và thực hiện kinh tế thị trường."],"a":1},{"ch":3,"n":62,"q":"Phương châm chỉ đạo của Đại hội XII của Đảng?","o":["Đoàn kết - Dân chủ - Kỷ cương - Đổi mới.","Đoàn kết - Dân chủ - Kỷ cương - Sáng tạo - Phát triển.","Dân giàu - Nước mạnh - Công bằng - Văn minh.","Đoàn kết - Dân chủ - Công bằng - Văn minh"],"a":0},{"ch":3,"n":63,"q":"Trong quá trình lãnh đạo đất nước thời kỳ đổi mới (1986-nay), Đảng Cộng sản Việt Nam đã rút ra được bao nhiêu bài học kinh nghiệm?","o":["2","3","4","5"],"a":3},{"ch":3,"n":64,"q":"Trong Hội nghị đại biểu toàn quốc giữa nhiệm kỳ của Đảng (1/1994) đã chỉ ra mấy thách thức lớn","o":["3","4","5","6"],"a":1},{"ch":3,"n":65,"q":"Vì sao việc thống nhất đất nước về mặt nhà nước lại cần phải được xúc tiến một cách khẩn trương, càng sớm càng tốt?","o":["Để nhanh chóng tạo ra sức mạnh toàn diệncủa đất nước","Để Đảng và Chính phủ tăng thêm quyền lực","Để nhận được sự viện trợ từ các nước xã hội chủ nghĩa","Để thúc đẩy quá trình Việt Nam gia nhập vào Tổ chức Thương mại thế giới"],"a":0},{"ch":3,"n":66,"q":"Đại hội IV của Đảng (12/1976) đã nêu ra đặc điểm nổi bật của cách mạng Việt Nam trong giai đoạn mới là:","o":["Nước ta đang trong quá trình phát triển kinh tế một cách bền vững, đa nghề, đa ngành","Nước ta đang trong quá trình từ sản xuất nhỏ tiến thẳng lên chủ nghĩa xã hội, bỏ qua giai đoạn phát triển tư bản chủ nghĩa","Nước ta đang trong quá trình hoàn thành giai đoạn quá độ, chuẩn bị tiến lên chủ nghĩa xã hội","Nước ta đã hoàn thành giai đoạn xây dựng chủ nghĩa xã hội, chuẩn bị tiến lên xã hội Cộng sản"],"a":1},{"ch":3,"n":67,"q":"So với Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam (1991), Cương lĩnh bổ sung phát triển năm 2011 bổ sung mấy đặc trưng bao trùm, tổng quát?","o":["1","2","3","4"],"a":1}];
const L = ['A','B','C','D'];
const CH = {
  0:{name:'Chương 0', desc:'Đối tượng, phương pháp học Lịch sử Đảng', term:'gk'},
  1:{name:'Chương 1', desc:'Đảng ra đời, giành chính quyền (1930 – 1945)', term:'gk'},
  2:{name:'Chương 2', desc:'Hai cuộc kháng chiến (1945 – 1975)', term:'gk'},
  3:{name:'Chương 3', desc:'Quá độ lên CNXH và đổi mới (1975 – nay)', term:'ck'}
};
const PRESETS = [
  {id:'mid',  name:'Giữa kỳ',            desc:'Chương 0, 1, 2', chapters:[0,1,2]},
  {id:'final',name:'Cuối kỳ, toàn bộ',   desc:'Chương 0 đến 3', chapters:[0,1,2,3]},
  {id:'new',  name:'Phần mới cuối kỳ',   desc:'Chương 3', chapters:[3]}
];
const FIXED = /^\s*(Tất cả|Cả\s*(\d|ba|hai|A|B|C|D))/i; // đáp án kiểu "Tất cả các đáp án trên": giữ nguyên thứ tự A–D
const app = document.getElementById('app');
let st = {};
let setup = {chapters:[0,1,2], count:0, shuffleOpts:true};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function countOf(ch){return DATA.filter(d=>d.ch===ch).length}

function prep(q){
  const keep = !setup.shuffleOpts || q.o.some(t=>FIXED.test(t));
  const order = keep ? [0,1,2,3] : shuffle([0,1,2,3]);
  return {base:q, order, opts:order.map(i=>q.o[i]), a:order.indexOf(q.a), fixed:keep && setup.shuffleOpts};
}

function themeBtn(){return '<button class="theme" id="theme" type="button">Sáng/Tối</button>'}
function bindTheme(){
  const b=document.getElementById('theme'); if(!b) return;
  b.onclick=()=>{
    const r=document.documentElement;
    const dark=r.dataset.theme? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
    r.dataset.theme=dark?'light':'dark';
  };
}

function home(){
  st={};
  app.innerHTML=`
  <div class="head"><div><div class="label">Lịch sử Đảng Cộng sản Việt Nam</div><h1>Ôn tập trắc nghiệm</h1></div>${themeBtn()}</div>
  <div class="card">
    <h2>Chọn phạm vi ôn</h2>
    <p class="muted">${DATA.length} câu. Mỗi lượt làm bài, thứ tự câu hỏi và vị trí đáp án A, B, C, D đều được xáo trộn lại.</p>
    <div class="presets">
      ${PRESETS.map(p=>{const n=DATA.filter(d=>p.chapters.includes(d.ch)).length;return `<button type="button" class="preset" data-p="${p.id}" aria-pressed="false"><b>${p.name}</b><span>${p.desc} · ${n} câu</span></button>`}).join('')}
    </div>
    <div class="label" style="margin-top:18px">Hoặc tự chọn chương</div>
    <div class="chapters">
      ${Object.keys(CH).map(k=>`<label class="chk"><input type="checkbox" class="ch" value="${k}"><div><b>${CH[k].name} <span class="badge ${CH[k].term==='ck'?'ck':''}">${CH[k].term==='ck'?'Cuối kỳ':'Giữa kỳ'}</span></b><span>${CH[k].desc} · ${countOf(+k)} câu</span></div></label>`).join('')}
    </div>
    <div class="row" style="margin-top:18px">
      <label for="cnt" class="muted">Số câu mỗi lượt</label>
      <select id="cnt"><option value="0">Tất cả</option><option value="20">20 câu</option><option value="30">30 câu</option><option value="50">50 câu</option><option value="100">100 câu</option></select>
      <label class="opt-line"><input type="checkbox" id="so" ${setup.shuffleOpts?'checked':''}> Xáo trộn vị trí đáp án A–D</label>
    </div>
    <p class="muted" style="font-size:.85rem;margin-top:8px">Các câu có đáp án “Tất cả các đáp án trên” giữ nguyên thứ tự đáp án để đề không bị sai nghĩa.</p>
    <div class="row" style="margin-top:20px"><button class="btn" id="go" type="button">Bắt đầu làm bài</button><span class="muted" id="avail"></span></div>
  </div>`;
  bindTheme();
  const boxes=[...document.querySelectorAll('.ch')];
  boxes.forEach(b=>b.checked=setup.chapters.includes(+b.value));
  document.getElementById('cnt').value=String(setup.count);
  const sync=()=>{
    const sel=boxes.filter(b=>b.checked).map(b=>+b.value).sort();
    setup.chapters=sel;
    const n=DATA.filter(d=>sel.includes(d.ch)).length;
    document.getElementById('avail').textContent=n?`${n} câu có sẵn`:'Hãy chọn ít nhất một chương';
    document.getElementById('go').disabled=!n;
    document.querySelectorAll('.preset').forEach(p=>{
      const pr=PRESETS.find(x=>x.id===p.dataset.p);
      p.setAttribute('aria-pressed', String(JSON.stringify(pr.chapters)===JSON.stringify(sel)));
    });
  };
  boxes.forEach(b=>b.onchange=sync);
  document.querySelectorAll('.preset').forEach(p=>p.onclick=()=>{
    const pr=PRESETS.find(x=>x.id===p.dataset.p);
    boxes.forEach(b=>b.checked=pr.chapters.includes(+b.value)); sync();
  });
  document.getElementById('cnt').onchange=e=>setup.count=+e.target.value;
  document.getElementById('so').onchange=e=>setup.shuffleOpts=e.target.checked;
  sync();
  document.getElementById('go').onclick=()=>{
    let pool=shuffle(DATA.filter(d=>setup.chapters.includes(d.ch)));
    if(setup.count&&setup.count<pool.length) pool=pool.slice(0,setup.count);
    start(pool);
  };
}

function start(basePool){
  st={list:shuffle(basePool).map(prep),i:0,ans:[],picked:null,finished:false};
  render();
}

function render(){
  const q=st.list[st.i], total=st.list.length, done=st.picked!==null;
  const right=st.ans.filter(a=>a.ok).length;
  app.innerHTML=`
  <div class="top">
    <div class="meta"><span>Câu ${st.i+1} / ${total}</span><span>Đúng ${right} · Sai ${st.ans.length-right}</span></div>
    <div class="bar"><i style="width:${(st.i/total)*100}%"></i></div>
  </div>
  <div class="card">
    <div class="tag"><span class="badge ${CH[q.base.ch].term==='ck'?'ck':''}">${CH[q.base.ch].name}</span></div>
    <p class="q">${esc(q.base.q)}</p>
    <div class="opts">
      ${q.opts.map((t,k)=>{
        let cls=''; if(done){ if(k===q.a) cls='ok'; else if(k===st.picked) cls='bad'; }
        return `<button type="button" class="opt ${cls}" data-k="${k}" ${done?'disabled':''}><span class="k">${L[k]}</span><span class="t">${esc(t)}</span></button>`}).join('')}
    </div>
    ${done?`<p class="verdict ${st.picked===q.a?'ok':'bad'}">${st.picked===q.a?'Chính xác.':'Chưa đúng. Đáp án đúng là '+L[q.a]+'.'}</p>`:''}
    <div class="foot">
      <button class="btn ghost" id="quit" type="button">Thoát</button>
      <button class="btn" id="next" type="button" ${done?'':'disabled'}>${st.i+1===total?'Xem kết quả':'Câu tiếp theo'}</button>
    </div>
  </div>
  <p class="muted" style="font-size:.85rem">Phím tắt: A, B, C, D để chọn đáp án; Enter để sang câu tiếp.</p>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  document.getElementById('next').onclick=next;
  document.getElementById('quit').onclick=()=>{ if(st.ans.length) result(); else home(); };
  window.scrollTo({top:0});
}

function pick(k){
  if(!st.list||st.finished||st.picked!==null) return;
  const q=st.list[st.i];
  st.picked=k; st.ans.push({q,k,ok:k===q.a});
  render();
  document.getElementById('next').focus({preventScroll:true});
}
function next(){
  if(st.picked===null) return;
  if(st.i+1>=st.list.length){ result(); return; }
  st.i++; st.picked=null; render();
}

function result(){
  const n=st.ans.length, ok=st.ans.filter(a=>a.ok).length, pct=n?Math.round(ok/n*100):0;
  const wrong=st.ans.filter(a=>!a.ok);
  const msg=pct>=90?'Rất vững.':pct>=70?'Khá tốt.':pct>=50?'Cần ôn thêm một số phần.':'Nên ôn lại từ đầu.';
  st.finished=true;
  app.innerHTML=`
  <div class="head"><h1>Kết quả</h1>${themeBtn()}</div>
  <div class="card">
    <div class="score"><b>${ok}/${n}</b><span class="muted">${pct}% · ${msg}</span></div>
    <div class="row" style="margin-top:20px">
      <button class="btn" id="again" type="button">Làm lại, xáo trộn mới</button>
      ${wrong.length?`<button class="btn ghost" id="redo" type="button">Chỉ làm ${wrong.length} câu sai</button>`:''}
      <button class="btn ghost" id="home" type="button">Chọn lại phạm vi</button>
    </div>
  </div>
  ${wrong.length?`<h2>Các câu làm sai</h2><div class="review">${wrong.map(a=>`
    <div class="rv"><div class="tag"><span class="badge ${CH[a.q.base.ch].term==='ck'?'ck':''}">${CH[a.q.base.ch].name}</span></div><p>${esc(a.q.base.q)}</p>
    <p class="you">Bạn chọn ${L[a.k]}. ${esc(a.q.opts[a.k])}</p>
    <p class="right">Đáp án ${L[a.q.a]}. ${esc(a.q.opts[a.q.a])}</p></div>`).join('')}</div>`:'<p class="muted">Bạn trả lời đúng toàn bộ.</p>'}`;
  bindTheme();
  const all=st.ans.map(a=>a.q.base);
  document.getElementById('again').onclick=()=>start(all);
  const r=document.getElementById('redo'); if(r) r.onclick=()=>start(wrong.map(a=>a.q.base));
  document.getElementById('home').onclick=home;
  window.scrollTo({top:0});
}

document.addEventListener('keydown',e=>{
  if(!st.list||st.finished||e.ctrlKey||e.metaKey||e.altKey) return;
  const k=L.indexOf(e.key.toUpperCase());
  if(e.key.length===1&&k>-1&&st.picked===null) pick(k);
  else if(e.key==='Enter'&&st.picked!==null){e.preventDefault();next();}
});
home();
</script>
</body>
</html>
